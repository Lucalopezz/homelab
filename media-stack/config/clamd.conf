User clamav
LocalSocket /run/clamav/clamd.ctl
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly yes
FailIfCvdOlderThan 7
LogFile /var/log/clamav/clamav.log
LogTime yes
LogRotate yes
LogFileMaxSize 10M
TemporaryDirectory /var/tmp
MaxThreads 1
MaxQueue 4
ConcurrentDatabaseReload no
MaxScanTime 1200000
MaxFileSize 2560M
# Orçamento agregado: arquivo original + conteúdo interno analisado.
MaxScanSize 5120M
StreamMaxLength 2560M
AlertExceedsMax yes
AlertEncrypted yes
AlertBrokenExecutables yes
ScanPE yes
ScanELF yes
ScanArchive yes
FollowDirectorySymlinks no
FollowFileSymlinks no
SelfCheck 600
