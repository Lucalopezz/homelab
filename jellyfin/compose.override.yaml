services:
  jellyfin:
    image: ${LAB_JELLYFIN_IMAGE:?}
    user: "${LAB_JELLYFIN_UID:?}:${LAB_JELLYFIN_GID:?}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 384
    mem_limit: 2g
    cpus: 2.0
    environment:
      XDG_CACHE_HOME: /cache
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=16m,mode=755
    volumes:
      - type: bind
        source: /mnt/dados/lab/jellyfin/runtime/config
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: /mnt/dados/lab/jellyfin/runtime/cache
        target: /cache
        bind: {create_host_path: false}
      - type: bind
        source: /mnt/dados/lab/jellyfin/biblioteca
        target: /lab-media
        read_only: true
        bind: {create_host_path: false}
